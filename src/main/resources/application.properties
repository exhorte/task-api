spring.application.name=task-api
server.port=8085

# === Base de données (sera surchargée par ConfigMap Kubernetes) ===
spring.datasource.url=jdbc:mysql://localhost:3306/taskdb?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# === Actuator — probes Kubernetes ===
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true
management.endpoint.prometheus.enabled=true

# === Chemin de base actuator (pour Nginx /l3gl/) ===
management.endpoints.web.base-path=/actuator